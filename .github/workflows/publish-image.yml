name: Publish immutable image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-gate:
    if: vars.LEGACY_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record planned-only state
        run: echo "Deployment remains gated until migration, parity, rollback, capacity, secrets, WIF, GitOps and staging gates pass."

  publish:
    permissions:
      contents: read
      id-token: write
    if: vars.LEGACY_DEPLOY_ENABLED == 'true'
    uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/.github/workflows/publish-image.yml@6e3bb55f5ff3ee2b69dd6b4aee6333777ba0ed36
    with:
      image: ${{ vars.LEGACY_ARTIFACT_REGISTRY }}/legacy-maliev-career-service
      dockerfile: Legacy.Maliev.CareerService.Api/Dockerfile
      context: .
      legacy-service-defaults-ref: 9c4ac9d44a08bcd0aa2088348790ab863814669c
      compatibility-contracts-ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
      environment: legacy-production
      workload-identity-provider: ${{ vars.LEGACY_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.LEGACY_CAREER_PUBLISHER_SERVICE_ACCOUNT }}
