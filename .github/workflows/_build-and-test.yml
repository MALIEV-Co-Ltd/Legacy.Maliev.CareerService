name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/runner-results
    steps:
      - name: Check out CareerService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: c40a7f82cea347b949444dcd7fb730f2b8dc3c0e
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up .NET for build-first focused regression
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        timeout-minutes: 5
        with:
          dotnet-version: 10.0.x
      - name: Build Release and run changed-behavior regressions before full suite
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          mkdir -p runner-results/focus24
          dotnet restore Legacy.Maliev.CareerService.slnx 2>&1 | tee runner-results/focus24/restore.log
          dotnet build Legacy.Maliev.CareerService.slnx --configuration Release --no-restore --warnaserror 2>&1 | tee runner-results/focus24/build.log
          grep -Eq '^[[:space:]]*0 Warning\(s\)[[:space:]]*$' runner-results/focus24/build.log
          grep -Eq '^[[:space:]]*0 Error\(s\)[[:space:]]*$' runner-results/focus24/build.log
          VSTestCollect='' dotnet test Legacy.Maliev.CareerService.Tests/Legacy.Maliev.CareerService.Tests.csproj --configuration Release --no-build --no-restore --filter 'FullyQualifiedName~CareerOfferDetailSourceHttpTests|FullyQualifiedName~Update_ChangesExistingLevelAndRefreshesPublicProjectionWithoutChangingEitherPrincipalOrSurvivor|FullyQualifiedName~SelectedOfferDeletion_PreservesSharedLevelsAndSurvivorsAndRecomputesGlobalOpenStatus|FullyQualifiedName~LevelGraph_|FullyQualifiedName~Legacy.Maliev.CareerService.Tests.Controllers.CareerFixtureLifetimeTests' --logger 'trx;LogFileName=career-focus24.trx' --results-directory runner-results/focus24 2>&1 | tee runner-results/focus24/test.log
          grep -Eq 'Failed:[[:space:]]+0, Passed:[[:space:]]+29, Skipped:[[:space:]]+0, Total:[[:space:]]+29,' runner-results/focus24/test.log
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.CareerService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Validate safe scaffold orchestration
        shell: pwsh
        run: ./tooling/Test-CareerScaffoldContract.ps1 -EvidencePath ./runner-results/career-scaffold-orchestration.json
      - name: Gate owned production coverage
        run: python3 scripts/verify-runner-coverage.py runner-results
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: career-validation-${{ github.sha }}
          path: runner-results
          if-no-files-found: warn
          retention-days: 7
          archive: true
